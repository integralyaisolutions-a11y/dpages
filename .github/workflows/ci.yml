name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # El runner de migraciones y los transformadores corren tests de
    # integración reales contra este Postgres (esquemas aislados y
    # descartables por corrida, ver los *.test.ts de db/ y transform/).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dpages
          POSTGRES_PASSWORD: dpages
          POSTGRES_DB: dpages_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpages"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://dpages:dpages@localhost:5432/dpages_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
        # "npm ci" ya compila @dpages/shared por su cuenta (script
        # "postinstall" en la raíz) — no hace falta un paso de build aparte.

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
