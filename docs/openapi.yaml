openapi: 3.0.3
info:
  title: dPagès API v1
  version: '1.0'
  description: >
    API interna del sistema de gestión de comandas de dPagès. Fuente única de
    verdad del contrato entre backend y frontend — ver también
    docs/contrato-api.md para las explicaciones de negocio detrás de cada
    regla (por qué el empaquetado exige valores obligatorios, qué es
    kgEditable, etc.).

    Refleja el estado confirmado hasta la capa 11 (detalle de incidencias,
    CORS, alta manual de cliente, dirección de entrega del pedido, fecha y
    observación por línea, código de tarifa) MÁS las decisiones funcionales
    confirmadas con el cliente el 18/08/2026: campos de agrupación de
    artículo (formato, envasado, agrupación de producción), agrupación de
    rendimiento por categoría, Rendiments Porcs, Panell Producció (shape
    cerrado; las fórmulas numéricas todavía no — ver
    docs/contrato-api.md sección 4.10), Panell Obrador por línea individual
    (ya no agrupado por producto), orígenes de pedido como tabla mantenible
    (ya no un enum fijo), y usuarios/roles. Esta versión es SOLO contrato —
    los endpoints nuevos (rendiments-porcs, panells/produccio,
    origens-comanda, usuaris, rols, jo) todavía no están implementados en
    el backend real.
  contact:
    name: VisioFlow Tech

servers:
  - url: http://localhost:8080
    description: Desarrollo local

security:
  - bearerAuth: []

tags:
  - name: Salut
  - name: Categories
  - name: Productes
  - name: RendimentsPorcs
  - name: Tarifes
  - name: Clients
  - name: Transportistes
  - name: Comandes
  - name: OrigensComanda
  - name: Empaquetat
  - name: Panells
  - name: Usuaris
  - name: Rols

paths:
  /salut:
    get:
      tags: [Salut]
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  estat: { type: string, example: ok }
                  versio: { type: string, example: '0.1.0' }
                  baseDades: { type: string, example: ok }

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Listar categorías de artículo
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Categoria' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Categories]
      summary: Crear una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaEntrada' }
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/categories/{id}:
    patch:
      tags: [Categories]
      summary: Actualizar una categoría (parcial)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaEntrada' }
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    delete:
      tags: [Categories]
      summary: >-
        Eliminar una categoría. Borrado protegido: si algún artículo activo
        todavía la usa, responde 409 con el recuento en vez de dejar
        artículos con una referencia rota.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/productes:
    get:
      tags: [Productes]
      summary: Listar artículos del catálogo
      parameters:
        - name: categoriaId
          in: query
          schema: { type: integer }
        - name: tipus
          in: query
          schema: { type: string, enum: [simple, variable] }
        - name: actiu
          in: query
          schema: { type: boolean }
        - name: cerca
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Producte' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Productes]
      summary: Crear un artículo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProducteEntrada' }
      responses:
        '201':
          description: Artículo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producte' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/productes/{id}:
    get:
      tags: [Productes]
      summary: Obtener un artículo
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Artículo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producte' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    patch:
      tags: [Productes]
      summary: Actualizar un artículo (parcial)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProducteEntrada' }
      responses:
        '200':
          description: Artículo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producte' }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/rendiments-porcs:
    get:
      tags: [RendimentsPorcs]
      summary: >-
        Listar fichas de rendimiento porcino. Nuevo, confirmado 18/08/2026.
        Sólo devuelve fichas cuyo producto pertenece a una categoría con
        agrupacioRendiment definido (ver descripción del schema RendimentPorc).
      parameters:
        - name: agrupacioRendiment
          in: query
          schema: { type: string, enum: [KG, MAGRE, PAQ] }
        - name: categoria
          in: query
          schema: { type: string }
        - name: agrupacioProduccio
          in: query
          schema: { type: string }
        - name: producte
          in: query
          description: >-
            Filtra por descripció del producte, coincidencia exacta
            (case-insensitive) — regla 3.1 transversal del proyecto, no
            substring.
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/RendimentPorc' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [RendimentsPorcs]
      summary: Crear una ficha de rendimiento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RendimentPorcEntrada' }
      responses:
        '201':
          description: Ficha creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RendimentPorc' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/rendiments-porcs/{id}:
    patch:
      tags: [RendimentsPorcs]
      summary: >-
        Actualizar una ficha de rendimiento (parcial, edición en línea).
        producteId no se edita una vez creada la fila.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                unitatsPerPorc: { type: string, example: '2.00' }
                kgPerUnitat: { type: string, example: '3.500' }
      responses:
        '200':
          description: Ficha actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RendimentPorc' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    delete:
      tags: [RendimentsPorcs]
      summary: Eliminar una ficha de rendimiento
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/tarifes/matriu:
    get:
      tags: [Tarifes]
      summary: Matriz de precios (tarifa × artículo)
      parameters:
        - name: categoriaId
          in: query
          schema: { type: integer }
        - name: cerca
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Matriz paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  tarifes:
                    type: array
                    items: { $ref: '#/components/schemas/TarifaResum' }
                  dades:
                    type: array
                    items:
                      type: object
                      properties:
                        producteId: { type: integer }
                        codi: { type: string }
                        descripcio: { type: string }
                        preus:
                          type: object
                          additionalProperties:
                            type: string
                            nullable: true
                          example: { '1': '9.86', '2': null }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }

  /api/v1/tarifes:
    post:
      tags: [Tarifes]
      summary: Crear una tarifa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TarifaEntrada' }
      responses:
        '201':
          description: Tarifa creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TarifaResum' }
        '400': { $ref: '#/components/responses/Validacio' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/tarifes/{tarifaId}/preus/{producteId}:
    patch:
      tags: [Tarifes]
      summary: Actualizar el precio de un artículo en una tarifa (edición de celda)
      parameters:
        - name: tarifaId
          in: path
          required: true
          schema: { type: integer }
        - name: producteId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preu]
              properties:
                preu: { type: string, example: '9.50' }
      responses:
        '200':
          description: Precio actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  tarifaId: { type: integer }
                  producteId: { type: integer }
                  preu: { type: string }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/clients:
    get:
      tags: [Clients]
      summary: Listar clientes
      parameters:
        - name: cerca
          in: query
          schema: { type: string }
        - name: tarifaId
          in: query
          schema: { type: integer }
        - name: actiu
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Clients]
      summary: >
        Alta manual de cliente. Necesario cuando un pedido entra por
        teléfono/WhatsApp/email de alguien que todavía no existe en el
        sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientEntrada' }
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/clients/{id}:
    patch:
      tags: [Clients]
      summary: Actualizar un cliente (parcial) — asignar tarifa o transportista por defecto
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tarifaId: { type: integer, nullable: true }
                transportistaDefecteId: { type: integer, nullable: true }
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/transportistes:
    get:
      tags: [Transportistes]
      summary: Listar transportistas
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Transportista' }
    post:
      tags: [Transportistes]
      summary: Crear un transportista
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransportistaEntrada' }
      responses:
        '201':
          description: Transportista creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transportista' }
        '400': { $ref: '#/components/responses/Validacio' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/transportistes/{id}:
    patch:
      tags: [Transportistes]
      summary: Actualizar un transportista (parcial)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransportistaEntrada' }
      responses:
        '200':
          description: Transportista actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transportista' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/comandes:
    get:
      tags: [Comandes]
      summary: Listar pedidos
      parameters:
        - name: estat
          in: query
          schema: { $ref: '#/components/schemas/EstatComanda' }
        - name: clientId
          in: query
          schema: { type: integer }
        - name: origen
          in: query
          description: 'Codi de origen_comanda, ej. "woocommerce" o "manual" — ya no es un enum fijo.'
          schema: { type: string }
        - name: dataDes
          in: query
          schema: { type: string, format: date }
        - name: dataFins
          in: query
          schema: { type: string, format: date }
        - name: cerca
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/ComandaResum' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Comandes]
      summary: Alta manual de pedido (teléfono, email, WhatsApp)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComandaEntrada' }
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComandaDetall' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/comandes/{id}:
    get:
      tags: [Comandes]
      summary: Detalle de un pedido, con líneas e incidencias
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComandaDetall' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    patch:
      tags: [Comandes]
      summary: Actualizar cabecera del pedido (parcial)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComandaEntradaParcial' }
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComandaDetall' }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/comandes/{comandaId}/linies/{liniaId}:
    delete:
      tags: [Comandes]
      summary: Eliminar una línea de pedido
      parameters:
        - name: comandaId
          in: path
          required: true
          schema: { type: integer }
        - name: liniaId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/comandes/{comandaId}/linies/{liniaId}/lliurament:
    patch:
      tags: [Empaquetat]
      summary: >
        Registrar unidades y kilos entregados de una línea (panel de
        empaquetado). Ambos campos son obligatorios y no pueden ser cero —
        ver docs/contrato-api.md sección 5 para el motivo de negocio. Si el
        pedido está congelado, devuelve 409.
      parameters:
        - name: comandaId
          in: path
          required: true
          schema: { type: integer }
        - name: liniaId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitatsLliurades, kgLliurats]
              properties:
                unitatsLliurades: { type: integer, minimum: 1 }
                kgLliurats: { type: string, example: '9.750' }
      responses:
        '200':
          description: Línea confirmada
          content:
            application/json:
              schema:
                type: object
                properties:
                  liniaId: { type: integer }
                  comandaId: { type: integer }
                  unitatsLliurades: { type: integer }
                  kgLliurats: { type: string }
                  confirmatA: { type: string, format: date-time }
                  confirmatPer:
                    type: object
                    properties:
                      id: { type: string }
                      nom: { type: string }
        '400': { $ref: '#/components/responses/Validacio' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/panells/oficina:
    get:
      tags: [Panells]
      summary: Panel de oficina (solo lectura, con subtotales sobre todo lo filtrado)
      parameters:
        - name: dataExpedicioDes
          in: query
          schema: { type: string, format: date }
        - name: dataExpedicioFins
          in: query
          schema: { type: string, format: date }
        - name: transportistaId
          in: query
          schema: { type: integer }
        - name: estat
          in: query
          schema: { $ref: '#/components/schemas/EstatComanda' }
        - name: clientId
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Panel con totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      comandes: { type: integer }
                      linies: { type: integer }
                      totalKg: { type: string }
                      totalEur: { type: string }
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/ComandaResum' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }

  /api/v1/panells/obrador:
    get:
      tags: [Panells]
      summary: >-
        Panel de obrador (solo lectura). Confirmado con el cliente el
        18/08/2026: líneas de pedido INDIVIDUALES, ya no agrupado por
        artículo.
      parameters:
        - name: dataProduccioDes
          in: query
          schema: { type: string, format: date }
        - name: dataProduccioFins
          in: query
          schema: { type: string, format: date }
        - name: categoriaId
          in: query
          schema: { type: integer }
        - name: tipus
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Panel con totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      linies: { type: integer }
                      totalUnitats: { type: integer }
                      totalKg: { type: string }
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/FilaPanellObrador' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }

  /api/v1/panells/produccio:
    get:
      tags: [Panells]
      summary: >-
        Panel de producción (solo lectura, capa 16) — calculadora de
        demanda vs. rendimiento porcino. Ver docs/contrato-api.md sección
        4.10 para las fórmulas y el ejemplo numérico verificado.
      parameters:
        - name: nombrePorcs
          in: query
          required: true
          description: >-
            Obligatorio — sin valor, o con 0/negativo, responde 400
            VALIDACIO. Es una calculadora interactiva: no hay default
            silencioso posible sin inducir a error.
          schema: { type: number }
        - name: agrupacioRendiment
          in: query
          schema: { type: string, enum: [KG, MAGRE, PAQ] }
        - name: producte
          in: query
          description: >-
            Filtra por descripció del producte, coincidencia exacta
            (case-insensitive) — mismo criterio que GET /rendiments-porcs.
          schema: { type: string }
        - name: dataDes
          in: query
          description: 'Default: mañana (hoy + 1 día).'
          schema: { type: string, format: date }
        - name: dataFins
          in: query
          description: 'Default: hoy + 7 días.'
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Panel con totales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanellProduccio' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/panells/empaquetat:
    get:
      tags: [Panells]
      summary: Panel de empaquetado (única pantalla operativa con edición, vía /lliurament)
      parameters:
        - name: dataExpedicioDes
          in: query
          schema: { type: string, format: date }
        - name: dataExpedicioFins
          in: query
          schema: { type: string, format: date }
        - name: transportistaId
          in: query
          schema: { type: integer }
        - name: clientId
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Panel con totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      linies: { type: integer }
                      unitatsDemanades: { type: integer }
                      unitatsLliurades: { type: integer }
                      kgDemanats: { type: string }
                      kgLliurats: { type: string }
                      liniesConfirmades: { type: integer }
                      liniesPendents: { type: integer }
                  dades: { type: array, items: { type: object } }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }

  /api/v1/origens-comanda:
    get:
      tags: [OrigensComanda]
      summary: >-
        Listar orígenes de pedido. Nuevo, confirmado 18/08/2026 — reemplaza
        el enum fijo OrigenComanda. Todavía no implementado en el backend real.
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/OrigenComanda' }
    post:
      tags: [OrigensComanda]
      summary: Crear un origen de pedido
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrigenComandaEntrada' }
      responses:
        '201':
          description: Origen creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrigenComanda' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/origens-comanda/{id}:
    patch:
      tags: [OrigensComanda]
      summary: Actualizar un origen de pedido (parcial — codi no se edita)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nom: { type: string }
                actiu: { type: boolean }
      responses:
        '200':
          description: Origen actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrigenComanda' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    delete:
      tags: [OrigensComanda]
      summary: >-
        Eliminar un origen de pedido. En la práctica, preferir
        PATCH {actiu: false} si ya hay pedidos usando ese origen.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/rols:
    get:
      tags: [Rols]
      summary: >-
        Listar roles. Nuevo, confirmado 18/08/2026. Todavía no implementado
        en el backend real.
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Rol' }
    post:
      tags: [Rols]
      summary: Crear un rol
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolEntrada' }
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rol' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/rols/{id}:
    patch:
      tags: [Rols]
      summary: Actualizar un rol (parcial)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolEntrada' }
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rol' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    delete:
      tags: [Rols]
      summary: Eliminar un rol
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/usuaris:
    get:
      tags: [Usuaris]
      summary: >-
        Listar usuarios. Nuevo, confirmado 18/08/2026. Todavía no
        implementado en el backend real.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Usuari' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Usuaris]
      summary: Crear un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuariEntrada' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuari' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/usuaris/{id}:
    patch:
      tags: [Usuaris]
      summary: Actualizar un usuario (parcial)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuariEntrada' }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuari' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    delete:
      tags: [Usuaris]
      summary: Eliminar un usuario
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/jo:
    get:
      tags: [Usuaris]
      summary: >-
        Usuario autenticado (resuelto por el uid del token de Firebase) con
        su rol y módulos permitidos. Lo primero que llama el frontend
        después de loguearse. Nuevo, confirmado 18/08/2026. Todavía no
        implementado en el backend real.
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuari' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: >
        Requerido en todas las rutas excepto /salut. En desarrollo local con
        AUTH_DISABLED=true no hace falta enviarlo.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, default: 1 }
    Mida:
      name: mida
      in: query
      schema: { type: integer, default: 50, maximum: 200 }

  responses:
    NoTrobat:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validacio:
      description: Error de validación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflicte:
      description: Conflicto (p. ej. pedido congelado)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    EstatComanda:
      type: string
      enum: [oberta, en_proces, tancada, amb_incidencia]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codi:
              type: string
              enum: [VALIDACIO, NO_AUTENTICAT, SENSE_PERMIS, NO_TROBAT, CONFLICTE, ERROR_INTERN]
            missatge: { type: string }
            detalls:
              type: array
              items:
                type: object
                properties:
                  camp: { type: string }
                  missatge: { type: string }

    Paginacio:
      type: object
      properties:
        pagina: { type: integer }
        mida: { type: integer }
        total: { type: integer }
        totalPagines: { type: integer }

    Categoria:
      type: object
      properties:
        id: { type: integer }
        nom: { type: string }
        elaboratPorc: { type: boolean }
        agrupacioRendiment:
          type: string
          enum: [KG, MAGRE, PAQ]
          nullable: true
          description: >-
            Null sólo cuando elaboratPorc es false — regla de negocio, no
            falta de dato. Confirmado con el cliente el 18/08/2026.

    CategoriaEntrada:
      type: object
      description: >-
        Cuerpo de POST /categories (nom obligatorio) y PATCH /categories/{id}
        (cuerpo parcial). agrupacioRendiment sólo se acepta si elaboratPorc
        (el enviado, o si no viene, el actual) es true.
      properties:
        nom: { type: string }
        elaboratPorc: { type: boolean, default: false }
        agrupacioRendiment:
          type: string
          enum: [KG, MAGRE, PAQ]
          nullable: true

    Producte:
      type: object
      properties:
        id: { type: integer }
        codi: { type: string }
        descripcio: { type: string }
        descripcioVenda: { type: string }
        tipus: { type: string, enum: [simple, variable] }
        pesKg:
          type: string
          nullable: true
          description: 'Null = artículo «a medida»; el peso de línea queda editable'
        preuVenda: { type: string }
        actiu: { type: boolean }
        categoria:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nom: { type: string }
        agrupacioProduccio:
          type: string
          nullable: true
          description: Texto libre. Agrupa varios códigos bajo una misma familia lógica de producción.
        format:
          type: string
          enum: [SENCER, TALLAT, LLESCAT]
          nullable: true
        envasat:
          type: string
          enum: ['NORMAL', 'NORMAL (pes)', 'NORMAL (web)', 'ESPECIAL']
          nullable: true

    ProducteEntrada:
      type: object
      properties:
        codi: { type: string }
        descripcio: { type: string }
        descripcioVenda: { type: string }
        tipus: { type: string, enum: [simple, variable] }
        pesKg: { type: string, nullable: true }
        preuVenda: { type: string }
        categoriaId: { type: integer }
        agrupacioProduccio: { type: string, nullable: true }
        format: { type: string, enum: [SENCER, TALLAT, LLESCAT], nullable: true }
        envasat:
          type: string
          enum: ['NORMAL', 'NORMAL (pes)', 'NORMAL (web)', 'ESPECIAL']
          nullable: true

    Tarifa:
      type: object
      description: Referencia mínima, usada dentro de client.tarifa, comanda.tarifa, etc.
      properties:
        id: { type: integer }
        nom: { type: string }

    TarifaResum:
      type: object
      description: Forma usada en la matriz de tarifas (GET /tarifes/matriu), con código propio.
      properties:
        id: { type: integer }
        codi: { type: string }
        nom: { type: string }

    TarifaEntrada:
      type: object
      required: [codi, nom]
      description: Cuerpo de POST /tarifes. codi es único — repetido responde 409.
      properties:
        codi: { type: string }
        nom: { type: string }

    Client:
      type: object
      properties:
        id: { type: integer }
        codi: { type: string }
        nom: { type: string }
        nif: { type: string, nullable: true }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        poblacio: { type: string, nullable: true }
        tarifa:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nom: { type: string }
        transportistaDefecte:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nom: { type: string }
        actiu: { type: boolean }

    ClientEntrada:
      type: object
      required: [codi, nom, poblacio]
      description: Mínimo confirmado por el prototipo. El resto son opcionales.
      properties:
        codi: { type: string }
        nom: { type: string }
        poblacio: { type: string }
        tarifaId: { type: integer, nullable: true }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        nif: { type: string, nullable: true }

    Transportista:
      type: object
      properties:
        id: { type: integer }
        codi:
          type: string
          nullable: true
          description: 'Texto libre, nemotécnico, definido por el usuario al dar de alta — ej. "TR-DHL".'
        nom: { type: string }
        actiu: { type: boolean }

    TransportistaEntrada:
      type: object
      description: >-
        Cuerpo de POST /transportistes (nom obligatorio) y PATCH
        /transportistes/{id} (cuerpo parcial). codi es opcional pero único
        cuando se manda — repetido responde 409.
      properties:
        nom: { type: string }
        codi: { type: string, nullable: true }

    ComandaResum:
      type: object
      description: Forma usada en listados (GET /comandes, panell d'oficina)
      properties:
        id: { type: integer }
        num: { type: string }
        origen:
          type: string
          description: >-
            Codi de origen_comanda (ej. "woocommerce", "manual") — ya no es
            un enum fijo, ver el schema OrigenComanda y GET /origens-comanda.
        estat: { $ref: '#/components/schemas/EstatComanda' }
        client:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nom: { type: string }
            poblacio: { type: string }
        tarifa:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string } }
        transportista:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string } }
        poblacioDesti: { type: string, nullable: true }
        dataComanda: { type: string, format: date-time }
        dataProduccio: { type: string, format: date-time, nullable: true }
        dataExpedicio: { type: string, format: date-time, nullable: true }
        dataLliurament: { type: string, format: date-time, nullable: true }
        bultos: { type: integer, nullable: true }
        totalLinies: { type: integer }
        totalKg: { type: string }
        totalEur: { type: string }
        congelada: { type: boolean }
        totalIncidencies:
          type: integer
          description: Cantidad de incidencias asociadas al pedido
        tipusIncidencia:
          type: string
          nullable: true
          description: Null si hay más de un tipo de incidencia mezclado

    ComandaLinia:
      type: object
      properties:
        id: { type: integer }
        ordinal: { type: integer }
        producte:
          type: object
          nullable: true
          description: Null si el artículo no se pudo resolver (ver incidencies)
          properties:
            id: { type: integer }
            codi: { type: string }
            descripcio: { type: string }
        unitatsDemanades: { type: integer }
        kgDemanats: { type: string }
        kgEditable:
          type: boolean
          description: Calculado por el backend según si el artículo tiene pesKg
        dataProduccio:
          type: string
          format: date-time
          nullable: true
          description: Fecha de producción propia de la línea, distinta de la del pedido
        obsProduccio:
          type: string
          nullable: true
          description: Observación de producción propia de la línea
        unitatsLliurades: { type: integer }
        kgLliurats: { type: string }
        confirmatA: { type: string, format: date-time, nullable: true }
        preuUnitari:
          type: string
          description: >-
            Cascada de resolución: 1) tarifa asignada al cliente para este
            producto; 2) si no hay, el precio base del producto
            (Producte.preuVenda); 3) si tampoco hay, "0.00" con incidencia
            registrada.
        totalLinia: { type: string }
        esborrat: { type: boolean }

    Incidencia:
      type: object
      properties:
        tipus:
          type: string
          example: article_no_resolt
        detall: { type: string }
        creatA: { type: string, format: date-time }

    ComandaDetall:
      type: object
      description: Forma usada en GET /comandes/:id y POST /comandes
      properties:
        id: { type: integer }
        num: { type: string }
        origen:
          type: string
          description: >-
            Codi de origen_comanda (ej. "woocommerce", "manual") — ya no es
            un enum fijo, ver el schema OrigenComanda y GET /origens-comanda.
        estat: { $ref: '#/components/schemas/EstatComanda' }
        client:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string }, poblacio: { type: string } }
        tarifa:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string } }
        transportista:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string } }
        poblacioDesti: { type: string, nullable: true }
        adrecaLliurament:
          type: string
          nullable: true
          description: Dirección de entrega, distinta de la población de destino
        dataComanda: { type: string, format: date-time }
        dataProduccio: { type: string, format: date-time, nullable: true }
        dataExpedicio: { type: string, format: date-time, nullable: true }
        dataLliurament: { type: string, format: date-time, nullable: true }
        bultos: { type: integer, nullable: true }
        obsProduccio: { type: string, nullable: true }
        obsLliurament: { type: string, nullable: true }
        totalKg: { type: string }
        totalEur: { type: string }
        congelada: { type: boolean }
        congelatA: { type: string, format: date-time, nullable: true }
        linies:
          type: array
          items: { $ref: '#/components/schemas/ComandaLinia' }
        incidencies:
          type: array
          items: { $ref: '#/components/schemas/Incidencia' }

    ComandaEntrada:
      type: object
      required: [origen, clientId, linies]
      properties:
        origen:
          type: string
          description: >-
            Codi de origen_comanda (ej. "woocommerce", "manual") — ya no es
            un enum fijo, ver el schema OrigenComanda y GET /origens-comanda.
        clientId: { type: integer }
        dataLliurament: { type: string, format: date-time, nullable: true }
        transportistaId: { type: integer, nullable: true }
        obsLliurament: { type: string, nullable: true }
        linies:
          type: array
          items:
            type: object
            required: [producteId, unitatsDemanades]
            properties:
              producteId: { type: integer }
              unitatsDemanades: { type: integer, minimum: 1 }
              kgDemanats:
                type: string
                nullable: true
                description: Sólo si el artículo es «a medida» (sin pesKg)

    ComandaEntradaParcial:
      type: object
      properties:
        tarifaId: { type: integer, nullable: true }
        transportistaId: { type: integer, nullable: true }
        poblacioDesti: { type: string, nullable: true }
        adrecaLliurament: { type: string, nullable: true }
        dataProduccio: { type: string, format: date-time, nullable: true }
        dataExpedicio: { type: string, format: date-time, nullable: true }
        dataLliurament: { type: string, format: date-time, nullable: true }
        bultos: { type: integer, nullable: true }
        obsProduccio: { type: string, nullable: true }
        obsLliurament: { type: string, nullable: true }

    FilaPanellObrador:
      type: object
      description: >-
        Confirmado con el cliente el 18/08/2026: una fila por LÍNEA de
        pedido individual, ya no agrupado por producto.
      properties:
        liniaId: { type: integer }
        comandaId: { type: integer }
        producte:
          type: object
          properties:
            id: { type: integer }
            codi: { type: string, nullable: true }
            descripcio: { type: string }
        categoria: { type: string, nullable: true }
        format: { type: string, nullable: true }
        envasat: { type: string, nullable: true }
        client: { type: string, nullable: true }
        dataProduccio:
          type: string
          format: date-time
          nullable: true
          description: Fecha de producción propia de la línea.
        unitats: { type: integer }
        kg: { type: string }
        obsProduccio: { type: string, nullable: true }

    RendimentPorc:
      type: object
      description: >-
        Ficha de rendimiento por producto — base del cálculo de Panell
        Producció. Nueva, confirmada el 18/08/2026. Sólo aparece si el
        producto pertenece a una categoría con agrupacioRendiment definido
        (ver GET /rendiments-porcs).
      properties:
        id: { type: integer }
        producte:
          type: object
          properties:
            id: { type: integer }
            codi: { type: string, nullable: true }
            descripcio: { type: string }
        agrupacioRendiment:
          type: string
          description: Derivado de producte.categoria.agrupacioRendiment — sólo lectura.
        categoria:
          type: string
          description: Derivado de producte.categoria.nom — sólo lectura.
        agrupacioProduccio:
          type: string
          nullable: true
          description: Derivado de producte.agrupacioProduccio — sólo lectura.
        unitatsPerPorc: { type: string, example: '2.00' }
        kgPerUnitat: { type: string, example: '3.500' }
        pesTotal:
          type: string
          example: '7.000'
          description: Calculado = unitatsPerPorc × kgPerUnitat.

    RendimentPorcEntrada:
      type: object
      required: [producteId, unitatsPerPorc, kgPerUnitat]
      description: >-
        unitatsPerPorc admite hasta 2 decimales, kgPerUnitat hasta 3 (mismas
        escalas que la columna en base).
      properties:
        producteId: { type: integer }
        unitatsPerPorc: { type: string, example: '2.00' }
        kgPerUnitat: { type: string, example: '3.500' }

    OrigenComanda:
      type: object
      description: >-
        Entidad de origen_comanda (confirmado 18/08/2026: tabla mantenible,
        ya no un enum fijo). codi es el valor de ComandaResum.origen /
        ComandaDetall.origen.
      properties:
        id: { type: integer }
        codi: { type: string, example: woocommerce }
        nom: { type: string, example: WooCommerce }
        actiu: { type: boolean }

    OrigenComandaEntrada:
      type: object
      required: [codi, nom]
      properties:
        codi:
          type: string
          description: Estable una vez creado — no se edita por PATCH.
        nom: { type: string }
        actiu: { type: boolean, default: true }

    PanellProduccioFila:
      type: object
      description: >-
        Una fila por agrupacioProduccio (capa 16) — ver docs/contrato-api.md
        sección 4.10 para las fórmulas y el ejemplo numérico verificado.
      properties:
        agrupacioRendiment: { type: string, enum: [KG, MAGRE, PAQ] }
        categoria: { type: string }
        agrupacioProduccio: { type: string }
        producte:
          type: object
          properties:
            id: { type: integer }
            descripcio: { type: string }
        paqPedido:
          type: string
          nullable: true
          description: Null cuando agrupacioRendiment es KG o MAGRE (no aplica).
        kgAElaborar:
          type: string
          nullable: true
          description: Null cuando agrupacioRendiment es PAQ.
        rendiment:
          type: string
          nullable: true
          description: Null en filas MAGRE — van al total global, no por línea.
        diferencia:
          type: string
          nullable: true
          description: Mismo criterio que rendiment.

    PanellProduccio:
      type: object
      properties:
        totals:
          type: object
          properties:
            totalKgAElaborar: { type: string }
            totalKgMagro: { type: string }
            diferencia: { type: string }
        dades:
          type: array
          items: { $ref: '#/components/schemas/PanellProduccioFila' }
        paginacio: { $ref: '#/components/schemas/Paginacio' }

    Rol:
      type: object
      description: >-
        Define qué módulos ve el usuario en el frontend — no restringe
        acciones (ADR-021, ningún endpoint de negocio bloquea por rol).
        Nuevo, confirmado 18/08/2026.
      properties:
        id: { type: integer }
        nom: { type: string }
        modulsPermesos:
          type: array
          items: { type: string }
          example: [categories, catalog, tarifes, clients, comandes, panells]

    RolEntrada:
      type: object
      required: [nom, modulsPermesos]
      properties:
        nom: { type: string }
        modulsPermesos:
          type: array
          items: { type: string }

    Usuari:
      type: object
      description: Nuevo, confirmado 18/08/2026. Todavía no implementado en el backend real.
      properties:
        id: { type: integer }
        firebaseUid:
          type: string
          description: uid de Firebase Auth — vínculo con el token, ver ADR-021.
        nom: { type: string }
        email: { type: string }
        rol:
          type: object
          properties:
            id: { type: integer }
            nom: { type: string }
        actiu: { type: boolean }

    UsuariEntrada:
      type: object
      required: [firebaseUid, nom, email, rolId]
      properties:
        firebaseUid: { type: string }
        nom: { type: string }
        email: { type: string }
        rolId: { type: integer }
        actiu: { type: boolean, default: true }
